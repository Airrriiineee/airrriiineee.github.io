<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Katalog Produk - Irene's Gallery</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/katalog.css" />
</head>
<body class="katalog-page">
  <a href="index.html" class="kembali-button">← Kembali ke Beranda</a>
  <h1>Irene's Gallery</h1>

  <div class="filter-container">
    <select id="moment-select">
      <option value="semua">Semua Moment</option>

    <select id="jenis-select">
      <option value="semua">Semua Jenis</option>

    <input type="text" id="search-input" placeholder="Cari produk..." />

  <div id="loading-container">

  </div>

  <div id="produk-container" class="produk-grid"></div>
  <script src="script.js"></script>
